<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 — 양자화 스튜디오 스냅샷</title>
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{color-scheme:dark light}
  *{box-sizing:border-box}
  body{
    margin:0;background:#0f172a;color:#e2e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;
  }
  header{
    position:sticky;top:0;background:#0f172a;border-bottom:1px solid #334155;
    padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:10;
  }
  header a{color:#38bdf8;text-decoration:none;font-size:14px;white-space:nowrap}
  header h1{font-size:15px;margin:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  main{max-width:760px;margin:0 auto;padding:20px 20px 60px}
  #md{line-height:1.7;font-size:15px;word-break:keep-all}
  #md h1{font-size:22px;border-bottom:1px solid #334155;padding-bottom:8px}
  #md h2{font-size:18px;margin-top:32px;color:#7dd3fc}
  #md h3{font-size:15.5px;margin-top:22px}
  #md code{background:#1e293b;padding:1px 6px;border-radius:4px;font-size:.9em}
  #md pre{background:#1e293b;padding:12px;border-radius:8px;overflow-x:auto}
  #md pre code{background:none;padding:0}
  #md table{border-collapse:collapse;width:100%;overflow-x:auto;display:block;font-size:13px}
  #md th,#md td{border:1px solid #334155;padding:6px 10px;text-align:left}
  #md th{background:#1e293b}
  #md blockquote{border-left:3px solid #38bdf8;margin:0;padding:2px 16px;color:#94a3b8}
  #md a{color:#38bdf8}
  #md strong{color:#f8fafc}
</style>
</head>
<body>
<header>
  <a href="index.html">← 스냅샷</a>
  <h1 id="title">문서</h1>
</header>
<main><div id="md">불러오는 중…</div></main>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get("src") || "FINDINGS.md";
  document.getElementById("title").textContent = src;
  document.title = src + " — 양자화 스튜디오 스냅샷";
  fetch(src).then(r => r.text()).then(text => {
    document.getElementById("md").innerHTML = marked.parse(text);
  }).catch(e => {
    document.getElementById("md").textContent = "로드 실패: " + e;
  });
</script>
</body>
</html>
