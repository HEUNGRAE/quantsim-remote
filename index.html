<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚛️ 양자화 스튜디오 원격 접속</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<style>
  :root{color-scheme:dark light}
  *{box-sizing:border-box}
  html,body{width:100%;overflow-x:hidden}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:#0f172a;color:#e2e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;
    padding:24px;
  }
  .card{
    width:100%;max-width:380px;margin:0 auto;background:#1e293b;border:1px solid #334155;
    border-radius:16px;padding:28px 24px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    box-sizing:border-box;
  }
  .icon{font-size:40px;margin-bottom:6px}
  h1{font-size:18px;margin:0 0 4px;font-weight:600}
  p.note{
    color:#94a3b8;font-size:13px;line-height:1.6;margin:0 0 20px;
    word-break:keep-all;overflow-wrap:break-word;
  }
  input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid #334155;
    background:#0f172a;color:#e2e8f0;font-size:15px;margin-bottom:12px;
    text-align:center;letter-spacing:.5px;
  }
  input:focus{outline:none;border-color:#38bdf8}
  button{
    width:100%;padding:13px;border:0;border-radius:10px;
    background:#38bdf8;color:#0f172a;font-size:15px;font-weight:600;
    cursor:pointer;
  }
  button:active{background:#0ea5e9}
  button:disabled{opacity:.5}
  .status{font-size:13px;margin-top:16px;min-height:18px;word-break:keep-all}
  .status.err{color:#f87171}
  .status.wait{color:#64748b}
  .reset{
    display:inline-block;margin-top:18px;font-size:12px;color:#475569;
    text-decoration:underline;cursor:pointer;background:none;border:0;
    width:auto;padding:0;font-weight:400;
  }
  .spinner{
    width:22px;height:22px;border:3px solid #334155;border-top-color:#38bdf8;
    border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none}
  .snaplink{
    display:block;margin-top:16px;padding-top:16px;border-top:1px solid #334155;
    font-size:12.5px;color:#7dd3fc;text-decoration:none;
  }
  .snaplink b{color:#a5f3fc}
  .snaplink .sub{display:block;color:#64748b;font-size:11px;margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <div id="autoView">
    <div class="spinner"></div>
    <h1 id="autoTitle">연결 확인 중…</h1>
    <p class="note" id="autoNote">저장된 접속 정보로 서버 상태를 확인하고 있습니다.</p>
    <a class="snaplink" href="snapshot/index.html">📦 <b>기다리지 않고 결과만 보기</b>
      <span class="sub">실시간 실행은 안 되지만 대시보드·문서는 항상 열람 가능</span></a>
  </div>

  <div id="setupView" class="hidden">
    <div class="icon">⚛️</div>
    <h1>양자화 스튜디오 원격 접속</h1>
    <p class="note" id="setupNote">최초 1회만 접속 토큰을 입력하면, 이후 이 주소로 올 때마다
      자동으로 연결됩니다. 토큰은 이 기기에만 저장되고 서버로 전송되지 않습니다.</p>
    <input id="tokenInput" placeholder="접속 토큰" autocomplete="off"
           autocapitalize="off" spellcheck="false">
    <button id="connectBtn" onclick="saveAndGo()">연결</button>
    <div class="status" id="statusMsg"></div>
    <a class="snaplink" href="snapshot/index.html">📦 <b>토큰이 없거나 PC가 꺼져있나요?</b>
      결과 스냅샷 보기
      <span class="sub">실시간 실행은 안 되지만 대시보드·문서는 항상 열람 가능</span></a>
  </div>

  <button id="resetBtn" class="reset hidden" onclick="resetToken()">다른 토큰 사용</button>
</div>

<script>
// 실제 서버 주소(Tailscale Funnel) — 공개돼도 무방합니다. 토큰 없이는 401만 뜹니다.
const HUB_URL = "https://book-d30lqbr0li.taild8105b.ts.net";
const KEY = "quantsim_hub_token";

// 이동 전에 반드시 /api/ping 으로 토큰을 검증한다 — 예전에는 바로
// location.replace 로 넘겨버려서, 토큰이 틀렸거나 서버가 꺼져 있어도
// 사용자는 quantsim-hub 의 401 HTML만 보고 원인을 알 수 없었고,
// replace 라 뒤로가기로 이 런처에 돌아올 수도 없었다(실제 겪은 버그).
async function verify(token) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(HUB_URL + "/api/ping?token=" + encodeURIComponent(token),
                          { signal: ctl.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!r.ok) return "server_error";
    const d = await r.json();
    return d.ok ? "ok" : "bad_token";
  } catch (e) {
    clearTimeout(timer);
    return "unreachable";           // 네트워크 실패 — PC 꺼짐/오프라인 등
  }
}

function enter(token) {
  location.href = HUB_URL + "/?token=" + encodeURIComponent(token);
}

async function saveAndGo() {
  const t = document.getElementById("tokenInput").value.trim();
  const btn = document.getElementById("connectBtn");
  const msg = document.getElementById("statusMsg");
  if (!t) { msg.className = "status err"; msg.textContent = "토큰을 입력해주세요."; return; }
  btn.disabled = true;
  msg.className = "status wait"; msg.textContent = "서버 확인 중…";
  const result = await verify(t);
  btn.disabled = false;
  if (result === "ok") {
    localStorage.setItem(KEY, t);
    msg.textContent = "연결됨 — 이동합니다…";
    enter(t);
  } else if (result === "bad_token") {
    msg.className = "status err";
    msg.textContent = "토큰이 올바르지 않습니다. 다시 확인해 주세요.";
  } else {
    msg.className = "status err";
    msg.textContent = "서버에 연결할 수 없습니다 — PC가 꺼져 있거나 오프라인일 수 있어요. "
      + "아래 '결과 스냅샷 보기'를 이용해 주세요.";
  }
}

function resetToken() {
  localStorage.removeItem(KEY);
  showSetup("");
}

function showSetup(msg) {
  document.getElementById("autoView").classList.add("hidden");
  document.getElementById("setupView").classList.remove("hidden");
  document.getElementById("resetBtn").classList.add("hidden");
  const m = document.getElementById("statusMsg");
  if (msg) { m.className = "status err"; m.textContent = msg; }
  document.getElementById("tokenInput").focus();
}

(async function init() {
  const saved = localStorage.getItem(KEY);
  if (!saved) { showSetup(""); return; }
  document.getElementById("resetBtn").classList.remove("hidden");
  const result = await verify(saved);
  if (result === "ok") {
    enter(saved);
  } else if (result === "bad_token") {
    localStorage.removeItem(KEY);
    showSetup("저장된 토큰이 더 이상 유효하지 않습니다. 새 토큰을 입력해 주세요.");
  } else {
    document.getElementById("autoTitle").textContent = "서버에 연결할 수 없습니다";
    document.getElementById("autoNote").innerHTML =
      "PC가 꺼져 있거나 오프라인일 수 있습니다.<br>저장된 토큰은 그대로 유지했습니다.";
    document.getElementById("resetBtn").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
